name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    name: Semantic Release & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Install git-chglog
        run: |
          GHCHGLOG_VERSION="0.15.4"
          curl -L https://github.com/git-chglog/git-chglog/releases/download/v${GHCHGLOG_VERSION}/git-chglog_${GHCHGLOG_VERSION}_linux_amd64.tar.gz | tar -xz
          chmod +x git-chglog
          sudo mv git-chglog /usr/local/bin/

      - name: Calculate next SemVer version
        id: version
        run: |
          chmod +x .github/scripts/calc-next-version.sh
          bash .github/scripts/calc-next-version.sh
  
          
      - name: Generate CHANGELOG
        if: env.SKIP_RELEASE != 'true'
        run: git-chglog --next-tag "${{ env.RELEASE_VERSION }}" -o CHANGELOG.md

      - name: Set Helm chart version and image tag values
        if: env.SKIP_RELEASE != 'true'
        run: |
          sed -i "s/^version:.*/version: ${{ env.RELEASE_VERSION }}/" charts/secrethor/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ env.RELEASE_VERSION }}\"/" charts/secrethor/Chart.yaml
          sed -i "s/^  tag: .*/  tag: ${{ env.RELEASE_VERSION }}/" charts/secrethor/values.yaml

      # The tag is created after this commit so that it points at the
      # changelog and chart metadata of the version being released.
      - name: Commit release files and tag
        if: env.SKIP_RELEASE != 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md charts/secrethor/Chart.yaml charts/secrethor/values.yaml
          git commit -m "chore(release): ${{ env.RELEASE_VERSION }}" || echo "No changes to commit"
          git tag -a "${{ env.RELEASE_VERSION }}" -m "Release ${{ env.RELEASE_VERSION }}"
          git push origin main "${{ env.RELEASE_VERSION }}"

      - name: Set up Docker Buildx
        if: env.SKIP_RELEASE != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Set up Helm
        if: env.SKIP_RELEASE != 'true'
        uses: azure/setup-helm@v3
        with:
          version: v3.14.0

      - name: Log in to Docker Hub
        if: env.SKIP_RELEASE != 'true'
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ vars.DOCKER_USERNAME }}" --password-stdin

      - name: Build and push Docker image
        if: env.SKIP_RELEASE != 'true'
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 -t docker.io/bonovoo/secrethor:${{ env.RELEASE_VERSION }} --push .

      - name: Package Helm chart
        if: env.SKIP_RELEASE != 'true'
        run: |
          mkdir -p dist
          helm package charts/secrethor --destination dist

      - name: Prepare Helm chart index for GitHub Pages
        if: env.SKIP_RELEASE != 'true'
        run: |
          mkdir -p gh-pages
          cp dist/secrethor-${{ env.RELEASE_VERSION }}.tgz gh-pages/
          # Keep previously released chart versions in the index.
          merge_args=()
          if git show origin/gh-pages:index.yaml > previous-index.yaml 2>/dev/null; then
            merge_args=(--merge previous-index.yaml)
          fi
          helm repo index gh-pages --url https://github.com/${{ github.repository }}/releases/download/${{ env.RELEASE_VERSION }} "${merge_args[@]}"
          touch gh-pages/.nojekyll

      - name: Push Helm chart to gh-pages branch
        if: env.SKIP_RELEASE != 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: gh-pages 
          publish_branch: gh-pages
          force_orphan: true

      - name: Attach artifacts to GitHub Release
        if: env.SKIP_RELEASE != 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          files: |
            dist/secrethor-${{ env.RELEASE_VERSION }}.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
