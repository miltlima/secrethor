---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.15.0
  name: secretpolicies.secrets.secrethor.dev
spec:
  group: secrets.secrethor.dev
  names:
    kind: SecretPolicy
    listKind: SecretPolicyList
    plural: secretpolicies
    singular: secretpolicy
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.enforcement
      name: Mode
      type: string
    - jsonPath: .status.secretsAudited
      name: Audited
      type: integer
    - jsonPath: .status.summary.policyViolations
      name: Violations
      type: integer
    - jsonPath: .status.summary.expired
      name: Expired
      type: integer
    - jsonPath: .status.summary.unused
      name: Unused
      type: integer
    - jsonPath: .status.lastAuditTime
      name: Last Audit
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SecretPolicy is the Schema for the secretpolicies API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SecretPolicySpec defines the desired state of SecretPolicy
            properties:
              allowedNamespaces:
                description: AllowedNamespaces lists the namespaces covered by the
                  policy. "*" covers all.
                items:
                  type: string
                type: array
              allowedTypes:
                items:
                  type: string
                type: array
              detectUnused:
                description: DetectUnused reports Secrets that no Pod, ServiceAccount
                  or Ingress references.
                type: boolean
              enforcement:
                default: Audit
                description: Enforcement is Audit (default, report only) or Enforce
                  (reject at admission).
                enum:
                - Audit
                - Enforce
                type: string
              forbiddenKeys:
                items:
                  type: string
                type: array
              maxAgeDays:
                description: |-
                  MaxAgeDays is the maximum number of days since the Secret data was last
                  written before it is reported as expired. 0 disables the check.
                minimum: 0
                type: integer
              requiredKeys:
                items:
                  type: string
                type: array
              valueConstraints:
                additionalProperties:
                  properties:
                    minLength:
                      type: integer
                    mustContain:
                      items:
                        type: string
                      type: array
                    regex:
                      type: string
                  type: object
                type: object
            type: object
          status:
            description: SecretPolicyStatus defines the observed state of SecretPolicy
            properties:
              findings:
                description: Findings lists the problems found, capped to keep the
                  object small.
                items:
                  description: Finding is one hygiene problem found in one Secret.
                  properties:
                    message:
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                    reason:
                      description: Reason is PolicyViolation, Expired or Unused.
                      type: string
                  required:
                  - message
                  - name
                  - namespace
                  - reason
                  type: object
                type: array
              findingsTruncated:
                description: FindingsTruncated is true when Findings does not hold
                  every finding.
                type: boolean
              lastAuditTime:
                description: LastAuditTime is when the Secrets covered by the policy
                  were last audited.
                format: date-time
                type: string
              secretsAudited:
                description: SecretsAudited is the number of Secrets covered by the
                  policy in the last audit.
                type: integer
              summary:
                description: |-
                  Summary counts every finding of the last audit, including the ones
                  left out of Findings.
                properties:
                  expired:
                    type: integer
                  policyViolations:
                    type: integer
                  unused:
                    type: integer
                required:
                - expired
                - policyViolations
                - unused
                type: object
            required:
            - secretsAudited
            - summary
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
