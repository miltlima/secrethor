---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - pods
  - secrets
  - serviceaccounts
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - secrets.secrethor.dev
  resources:
  - secretpolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - secrets.secrethor.dev
  resources:
  - secretpolicies/status
  verbs:
  - get
  - patch
  - update
