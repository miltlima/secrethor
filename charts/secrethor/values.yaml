replicaCount: 1

image:
  repository: docker.io/bonovoo/secrethor
  tag: 1.1.3
  pullPolicy: IfNotPresent

namespace:
  create: false

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

certManager:
  enabled: true
  serviceName: webhook-service
  secretName: webhook-server-cert
  issuerName: secrethor-selfsigned-issuer
  certName: secrethor-serving-cert
  caBundle: ""

# Auditing is always on and never writes to Secrets.
audit:
  # How often the Secrets covered by each SecretPolicy are re-audited.
  interval: 15m
  # Maximum number of findings kept in the status of each SecretPolicy.
  maxFindings: 100

# The admission webhook is optional. It is only needed for policies with
# `enforcement: Enforce` and for admission warnings; it requires cert-manager.
webhook:
  enabled: false
  # Fail rejects every Secret write while the webhook is unreachable; Ignore
  # lets them through unchecked.
  failurePolicy: Fail

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}

podAnnotations: {}

podSecurityContext: {}

securityContext: {}
