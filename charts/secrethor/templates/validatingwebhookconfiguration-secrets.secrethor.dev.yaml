{{- if .Values.webhook.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  labels:
    app.kubernetes.io/managed-by: helm
    app.kubernetes.io/name: secrethor
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: webhook
    app.kubernetes.io/part-of: secrethor
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
    control-plane: controller-manager
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/secrethor-webhook-cert
  name: secrets.secrethor.dev
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    caBundle: ""
    service:
      name: webhook-service
      namespace: {{ .Release.Namespace }}
      path: /validate-v1-secret
      port: 443
  failurePolicy: Fail
  timeoutSeconds: 30
  name: secrets.secrethor.dev
  namespaceSelector:
    matchExpressions:
    - key: cert-manager.io/disable-validation
      operator: NotIn
      values:
      - "true"
    # Never gate the cluster's own system secrets or the operator's namespace
    # (cert-manager must be able to renew the webhook certificate there).
    - key: kubernetes.io/metadata.name
      operator: NotIn
      values:
      - kube-system
      - {{ .Release.Namespace }}
  rules:
  - apiGroups:
    - ""
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - secrets
  sideEffects: None
{{- end }}
